<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Issues Tracker</title>
    <link
      rel="shortcut icon"
      href="./assets/github-logo.png"
      type="image/x-icon"
    />

    <!-- css link up -->
    <link rel="stylesheet" href="./style.css" />
    <!-- daisy ui cdn -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-neutral-100">
    <header class="bg-white">
      <nav
        class="navbar bg-base-100 shadow-sm h-auto flex flex-col md:flex-row justify-between items-center md:w-11/12 mx-auto gap-4"
      >
        <div class="flex justify-center items-center w-full md:w-fit">
          <a class="flex h-9 justify-between items-center gap-1 text-xl"
            ><img
              class="h-full w-auto object-contain"
              src="./assets/github-logo.png"
              alt="github-logo"
            />
            GitHub Issues Tracker
          </a>
        </div>

        <!-- Search -->
        <div class="w-full md:w-auto flex justify-center md:justify-end">
          <input type="text" placeholder="Search" class="input w-auto" />

          <button class="btn btn-primary shrink-0">Search</button>
        </div>
      </nav>
    </header>

    <!-- issue status section  -->
    <section class="mt-16">
      <div
        class="container w-11/12 max-w-[1120px] mx-auto shadow-sm rounded-md bg-white"
      >
        <div class="inner space-x-2 p-6">
          <button id="all-btn" class="btn btn-primary">All</button>
          <button id="open-btn" class="btn">Open</button>
          <button id="close-btn" class="btn">Close</button>
        </div>
      </div>
    </section>

    <!-- issue display section -->
    <section class="mt-4">
      <div
        class="container w-11/12 max-w-[1120px] mx-auto shadow-sm rounded-md bg-[#FBFBFB]"
      >
        <div
          class="header bg-white p-6 border-b border-b-neutral-300 flex flex-col gap-4 md:flex-row rounded-md rounded-b-none"
        >
          <div class="flex flex-1 items-center justify-start gap-2">
            <img
              class="w-auto object-contain"
              src="./assets/Aperture.png"
              alt=""
            />
            <div>
              <h4 class="text-xl">50 issues</h4>
              <p class="text-neutral-500">
                Track and manage your project issues
              </p>
            </div>
          </div>
          <!-- issue indecator -->
          <div class="flex items-center justify-end gap-4">
            <p class="h-fit space-x-2">
              <span class="w-3 h-3 rounded-full bg-success inline-block"></span>
              Open
            </p>
            <p class="h-fit space-x-2">
              <span class="w-3 h-3 rounded-full bg-primary inline-block"></span>
              Closed
            </p>
          </div>
        </div>

        <!-- ---------------------------------- -->
        <!-- ------------------------- issues display card section start from here -------------- -->
        <!-- issues container -->
        <div
          id="issues-container"
          class="rounded-md p-6 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3"
        >
          <!-- issue card  -->
          <div
            class="card border-t-4 border-success flex flex-col justify-start items-center rounded shadow"
          >
            <!-- card top -->
            <div class="p-4 space-y-3">
              <!-- 1 no div -->
              <div class="flex justify-between items-center w-full">
                <img src="./assets/Open-Status.png" alt="" />
                <p
                  class="text-error py-[6px] text-xs w-[80px] uppercase text-center rounded-full bg-[#FEECEC]"
                >
                  High
                </p>
              </div>

              <!-- 2 no div -->
              <div class="space-y-3">
                <!-- card text wrap -->
                <div class="space-y-2">
                  <h6 class="text-sm">Fix navigation menu on mobile devices</h6>
                  <p class="text-xs text-neutral-500">
                    The navigation menu doesn't collapse properly on mobile
                    devices...
                  </p>
                </div>
                <!-- card label wrapper -->
                <div class="flex max-w-fit">
                  <p
                    class="flex justify-between items-center max-w-fit gap-1 text-error py-[6px] px-2 text-xs uppercase text-center rounded-full bg-[#FEECEC] border border-error"
                  >
                    <img src="./assets/BugDroid.png" alt="" /> Bug
                  </p>
                  <p
                    class="flex justify-between items-center max-w-fit gap-1 text-[#D97706] py-[6px] px-2 text-xs uppercase text-center rounded-full bg-[#FFF8DB] border border-[#FDE68A]"
                  >
                    <img src="./assets/BugDroid.png" alt="" /> help wanted
                  </p>
                </div>
              </div>
            </div>

            <!--card bottom div  -->
            <div
              class="p-4 text-left w-full space-y-2 border-t border-t-neutral-300"
            >
              <p class="text-xs text-neutral-500">#1 by john_doe</p>
              <p class="text-xs text-neutral-500">1/15/2024</p>
            </div>
          </div>
          <!-- issue card end here  -->
        </div>
      </div>
    </section>

    <script src="./script/script.js"></script>
  </body>
</html>
